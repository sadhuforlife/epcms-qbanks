<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COREBTR | EPCMS</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    background:
        radial-gradient(circle at top left, #182848, transparent 45%),
        radial-gradient(circle at bottom right, #301b3f, transparent 45%),
        #080b12;
    color: white;
    padding: 30px 18px;
}

.container {
    max-width: 850px;
    margin: auto;
}

.header {
    text-align: center;
    margin-bottom: 35px;
}

.logo {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid rgba(255,255,255,0.25);
    margin-bottom: 15px;
}

h1 {
    margin: 5px 0;
    font-size: 34px;
    letter-spacing: 2px;
}

.subtitle {
    color: #aeb7c8;
    font-size: 15px;
}

.card {
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 15px;
    backdrop-filter: blur(12px);
    transition: 0.2s;
}

.card:hover {
    transform: translateY(-2px);
    background: rgba(255,255,255,0.10);
}

.card a {
    color: white;
    text-decoration: none;
    font-size: 17px;
    font-weight: bold;
    display: block;
}

.empty {
    text-align: center;
    color: #8f99aa;
    padding: 30px 10px;
}

.back {
    display: block;
    text-align: center;
    margin-top: 30px;
    color: #aeb7c8;
    text-decoration: none;
    font-size: 15px;
}

.back:hover {
    color: white;
}

.footer {
    text-align: center;
    margin-top: 35px;
    color: #697386;
    font-size: 13px;
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <img src="group.jpg" class="logo" alt="EPCMS">

        <h1>COREBTR</h1>
        <div class="subtitle">Qbanks / Tests</div>
    </div>

    <div class="card empty">
        No tests added yet.
    </div>

    <a class="back" href="./index.html">
        ← Back to EPCMS
    </a>

    <div class="footer">
        Maintained by @sadhu_4l
    </div>

</div>

</body>
</html>
