<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EPCMS | Qbanks & Tests</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    font-family: Arial, Helvetica, sans-serif;

    background:
        radial-gradient(circle at top left, #182848, transparent 45%),
        radial-gradient(circle at bottom right, #301b3f, transparent 45%),
        #080b12;

    color: white;

    padding: 30px 18px;
}

.container {
    max-width: 850px;
    margin: auto;
}

/* HEADER */

.header {
    text-align: center;
    margin-bottom: 35px;
}

.group-logo {
    width: 110px;
    height: 110px;

    border-radius: 50%;

    object-fit: cover;

    border: 3px solid rgba(255,255,255,0.25);

    margin-bottom: 15px;

    box-shadow: 0 10px 35px rgba(0,0,0,0.4);
}

h1 {
    margin: 5px 0;

    font-size: 42px;

    letter-spacing: 4px;
}

.subtitle {
    color: #aeb7c8;

    font-size: 16px;

    margin-top: 8px;
}

/* MAINTAINER */

.maintainer {
    display: flex;

    justify-content: center;
    align-items: center;

    gap: 10px;

    margin-top: 18px;

    color: #aeb7c8;

    font-size: 14px;
}

.dp {
    width: 35px;
    height: 35px;

    border-radius: 50%;

    object-fit: cover;

    border: 2px solid rgba(255,255,255,0.2);
}

/* CATEGORY CARDS */

.categories {
    display: grid;

    grid-template-columns: repeat(2, 1fr);

    gap: 16px;

    margin-top: 30px;
}

.category {
    display: block;

    text-decoration: none;

    color: white;

    background: rgba(255,255,255,0.07);

    border: 1px solid rgba(255,255,255,0.12);

    border-radius: 20px;

    padding: 25px 20px;

    text-align: center;

    backdrop-filter: blur(12px);

    transition:
        transform 0.2s ease,
        background 0.2s ease,
        border 0.2s ease;

    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
}

.category:hover {

    transform: translateY(-5px);

    background: rgba(255,255,255,0.11);

    border-color: rgba(255,255,255,0.25);

}

.category-icon {

    font-size: 30px;

    margin-bottom: 10px;
}

.category-name {

    font-size: 19px;

    font-weight: bold;

    letter-spacing: 1px;
}

.category-subtitle {

    margin-top: 7px;

    font-size: 13px;

    color: #8f99aa;
}

/* FOOTER */

.footer {

    text-align: center;

    margin-top: 40px;

    color: #697386;

    font-size: 13px;
}

/* MOBILE */

@media (max-width: 600px) {

    body {
        padding: 25px 15px;
    }

    h1 {
        font-size: 34px;
    }

    .group-logo {
        width: 95px;
        height: 95px;
    }

    .categories {

        grid-template-columns: 1fr;

        gap: 13px;
    }

    .category {

        padding: 21px 18px;
    }
}

</style>

</head>

<body>

<div class="container">

    <!-- HEADER -->

    <div class="header">

        <img
            src="group.jpg"
            class="group-logo"
            alt="EPCMS"
        >

        <h1>EPCMS</h1>

        <div class="subtitle">
            Qbanks / Tests
        </div>

        <div class="maintainer">

            <img
                src="dp.jpg"
                class="dp"
                alt="Maintainer"
            >

            <span>
                Maintained by @sadhu_4l
            </span>

        </div>

    </div>


    <!-- CATEGORIES -->

    <div class="categories">

        <!-- DAMS -->

        <a
            class="category"
            href="./DAMS.html"
        >

            <div class="category-icon">
                📚
            </div>

            <div class="category-name">
                DAMS
            </div>

            <div class="category-subtitle">
                Qbanks & Tests
            </div>

        </a>


        <!-- MARROW -->

        <a
            class="category"
            href="./MARROW.html"
        >

            <div class="category-icon">
                🧠
            </div>

            <div class="category-name">
                MARROW
            </div>

            <div class="category-subtitle">
                Qbanks & Tests
            </div>

        </a>


        <!-- PREPLADDER -->

        <a
            class="category"
            href="./PREPLADDER.html"
        >

            <div class="category-icon">
                🎓
            </div>

            <div class="category-name">
                PREPLADDER
            </div>

            <div class="category-subtitle">
                Qbanks & Tests
            </div>

        </a>


        <!-- CEREBELLUM -->

        <a
            class="category"
            href="./CEREBELLUM.html"
        >

            <div class="category-icon">
                🔬
            </div>

            <div class="category-name">
                CEREBELLUM
            </div>

            <div class="category-subtitle">
                Qbanks & Tests
            </div>

        </a>


        <!-- COREBTR -->

        <a
            class="category"
            href="./COREBTR.html"
        >

            <div class="category-icon">
                ⚡
            </div>

            <div class="category-name">
                COREBTR
            </div>

            <div class="category-subtitle">
                Qbanks & Tests
            </div>

        </a>

    </div>


    <!-- FOOTER -->

    <div class="footer">

        EPCMS • Qbanks / Tests

    </div>

</div>

</body>
</html>
