<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EPCMS | Qbanks & Tests</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background:
        radial-gradient(circle at top left, rgba(99,102,241,.18), transparent 32%),
        radial-gradient(circle at bottom right, rgba(14,165,233,.14), transparent 32%),
        #0b1020;
    color: #ffffff;
    min-height: 100vh;
}

.container {
    width: min(92%, 720px);
    margin: auto;
    padding: 35px 0 50px;
}

/* Header */
.header {
    text-align: center;
    margin-bottom: 32px;
}

.group-img {
    width: 105px;
    height: 105px;
    object-fit: cover;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,.85);
    box-shadow: 0 12px 35px rgba(0,0,0,.35);
    margin-bottom: 18px;
}

.title {
    font-size: 38px;
    font-weight: 800;
    letter-spacing: 2px;
}

.subtitle {
    margin-top: 7px;
    color: #aeb8d4;
    font-size: 15px;
}

.owner {
    margin-top: 16px;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 8px 14px 8px 8px;
    background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 30px;
    color: #dce3f7;
    font-size: 13px;
}

.owner img {
    width: 32px;
    height: 32px;
    object-fit: cover;
    border-radius: 50%;
}

/* Section */
.section-title {
    text-align: center;
    margin: 34px 0 18px;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 3px;
    color: #8f9bb8;
}

/* Category cards */
.categories {
    display: flex;
    flex-direction: column;
    gap: 13px;
}

.category {
    position: relative;
    display: flex;
    align-items: center;
    text-decoration: none;
    color: white;
    padding: 19px 20px;
    border-radius: 18px;
    background: rgba(255,255,255,.075);
    border: 1px solid rgba(255,255,255,.10);
    backdrop-filter: blur(14px);
    box-shadow: 0 8px 28px rgba(0,0,0,.18);
    transition: transform .2s ease, background .2s ease, border-color .2s ease;
    overflow: hidden;
}

.category::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(100deg, rgba(255,255,255,.08), transparent 55%);
    pointer-events: none;
}

.category:hover {
    transform: translateY(-2px);
    background: rgba(255,255,255,.11);
    border-color: rgba(255,255,255,.2);
}

.icon {
    width: 50px;
    height: 50px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 15px;
    background: rgba(255,255,255,.09);
    font-size: 25px;
    margin-right: 16px;
}

.info {
    flex: 1;
}

.name {
    font-size: 18px;
    font-weight: 700;
}

.description {
    margin-top: 4px;
    color: #9faac5;
    font-size: 13px;
}

.arrow {
    font-size: 25px;
    color: #8e9bb8;
    margin-left: 10px;
}

/* Footer */
.footer {
    text-align: center;
    margin-top: 35px;
    color: #66718d;
    font-size: 12px;
}

/* Mobile */
@media (max-width: 500px) {
    .container {
        width: 90%;
        padding-top: 25px;
    }

    .group-img {
        width: 92px;
        height: 92px;
    }

    .title {
        font-size: 32px;
    }

    .category {
        padding: 17px 15px;
        border-radius: 16px;
    }

    .icon {
        width: 46px;
        height: 46px;
        margin-right: 13px;
        font-size: 22px;
    }

    .name {
        font-size: 17px;
    }
}
</style>
</head>

<body>

<div class="container">

    <header class="header">

        <img src="group.jpg" class="group-img" alt="EPCMS">

        <div class="title">EPCMS</div>

        <div class="subtitle">
            Qbanks / Tests
        </div>

        <div class="owner">
            <img src="dp.jpg" alt="Maintainer">
            <span>Maintained by <strong>@sadhu_4l</strong></span>
        </div>

    </header>

    <div class="section-title">
        Select your Qbank
    </div>

    <div class="categories">

        <a href="DAMS.html" class="category">
            <div class="icon">🩺</div>
            <div class="info">
                <div class="name">DAMS</div>
                <div class="description">DAMS Qbanks & Tests</div>
            </div>
            <div class="arrow">›</div>
        </a>

        <a href="MARROW.html" class="category">
            <div class="icon">📚</div>
            <div class="info">
                <div class="name">Marrow</div>
                <div class="description">Marrow Qbanks & Tests</div>
            </div>
            <div class="arrow">›</div>
        </a>

        <a href="PREPLADDER.html" class="category">
            <div class="icon">⚡</div>
            <div class="info">
                <div class="name">PrepLadder</div>
                <div class="description">PrepLadder Qbanks & Tests</div>
            </div>
            <div class="arrow">›</div>
        </a>

        <a href="CEREBELLUM.html" class="category">
            <div class="icon">🧠</div>
            <div class="info">
                <div class="name">Cerebellum</div>
                <div class="description">Cerebellum Qbanks & Tests</div>
            </div>
            <div class="arrow">›</div>
        </a>

        <a href="COREBTR.html" class="category">
            <div class="icon">🔥</div>
            <div class="info">
                <div class="name">CoreBTR</div>
                <div class="description">CoreBTR Qbanks & Tests</div>
            </div>
            <div class="arrow">›</div>
        </a>

    </div>

    <div class="footer">
        EPCMS • Qbanks / Tests
    </div>

</div>

</body>
</html>
