<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EPCMS Qbanks</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: white;

    background:
        radial-gradient(circle at top left, #243b55, transparent 40%),
        radial-gradient(circle at bottom right, #141e30, transparent 45%),
        #090d16;

    padding: 30px 18px;
}

.container {
    max-width: 1000px;
    margin: auto;
}

/* HEADER */

.header {
    text-align: center;
    margin-bottom: 40px;
}

.group-logo {
    width: 105px;
    height: 105px;
    object-fit: cover;

    border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.25);

    box-shadow:
        0 10px 35px rgba(0,0,0,0.45);

    margin-bottom: 15px;
}

h1 {
    margin: 5px 0;

    font-size: 38px;
    letter-spacing: 1px;
}

.subtitle {
    color: #aeb8c7;
    font-size: 16px;
}

/* MAINTAINER */

.maintainer {
    display: flex;
    align-items: center;
    justify-content: center;

    gap: 10px;

    margin-top: 18px;

    color: #aeb8c7;
    font-size: 14px;
}

.dp {
    width: 34px;
    height: 34px;

    border-radius: 50%;
    object-fit: cover;

    border: 1px solid rgba(255,255,255,0.2);
}

/* CATEGORY GRID */

.categories {
    display: grid;

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    gap: 18px;
}

/* CATEGORY CARD */

.category {
    display: block;

    text-decoration: none;
    color: white;

    padding: 25px;

    min-height: 125px;

    background:
        rgba(255,255,255,0.07);

    border:
        1px solid rgba(255,255,255,0.11);

    border-radius: 20px;

    backdrop-filter: blur(14px);

    box-shadow:
        0 12px 35px rgba(0,0,0,0.20);

    transition:
        transform 0.2s ease,
        background 0.2s ease,
        box-shadow 0.2s ease;
}

.category:hover {
    transform: translateY(-4px);

    background:
        rgba(255,255,255,0.12);

    box-shadow:
        0 18px 40px rgba(0,0,0,0.35);
}

.category-icon {
    font-size: 30px;
    margin-bottom: 12px;
}

.category-name {
    font-size: 21px;
    font-weight: bold;

    margin-bottom: 7px;
}

.category-description {
    font-size: 13px;
    color: #9da8ba;
}

/* FOOTER */

footer {
    text-align: center;

    margin-top: 45px;

    color: #778194;

    font-size: 13px;
}

/* MOBILE */

@media (max-width: 650px) {

    body {
        padding:
            25px 15px;
    }

    h1 {
        font-size: 32px;
    }

    .categories {
        grid-template-columns: 1fr;
    }

    .category {
        min-height: 110px;
    }
}

</style>
</head>


<body>

<div class="container">


    <!-- HEADER -->

    <div class="header">

        <img
            src="./group.jpg"
            class="group-logo"
            alt="EPCMS"
        >

        <h1>
            EPCMS
        </h1>

        <div class="subtitle">
            Qbanks / Tests
        </div>


        <div class="maintainer">

            <img
                src="./dp.jpg"
                class="dp"
                alt="Maintainer"
            >

            <span>
                Maintained by @sadhu_4l
            </span>

        </div>

    </div>



    <!-- CATEGORIES -->

    <div class="categories">


        <!-- DAMS -->

        <a
            href="./category.html?category=DAMS"
            class="category"
        >

            <div class="category-icon">
                📚
            </div>

            <div class="category-name">
                DAMS
            </div>

            <div class="category-description">
                DAMS Qbanks & Tests
            </div>

        </a>



        <!-- MARROW -->

        <a
            href="./category.html?category=MARROW"
            class="category"
        >

            <div class="category-icon">
                🧠
            </div>

            <div class="category-name">
                Marrow
            </div>

            <div class="category-description">
                Marrow Qbanks & Tests
            </div>

        </a>



        <!-- PREPLADDER -->

        <a
            href="./category.html?category=PREPLADDER"
            class="category"
        >

            <div class="category-icon">
                📝
            </div>

            <div class="category-name">
                PrepLadder
            </div>

            <div class="category-description">
                PrepLadder Qbanks & Tests
            </div>

        </a>



        <!-- CEREBELLUM -->

        <a
            href="./category.html?category=CEREBELLUM"
            class="category"
        >

            <div class="category-icon">
                🔬
            </div>

            <div class="category-name">
                Cerebellum
            </div>

            <div class="category-description">
                Cerebellum Qbanks & Tests
            </div>

        </a>



        <!-- COREBTR -->

        <a
            href="./category.html?category=COREBTR"
            class="category"
        >

            <div class="category-icon">
                ⚡
            </div>

            <div class="category-name">
                CoreBTR
            </div>

            <div class="category-description">
                CoreBTR Qbanks & Tests
            </div>

        </a>


    </div>



    <!-- FOOTER -->

    <footer>

        EPCMS • Qbanks / Tests

        <br><br>

        Maintained by @sadhu_4l

    </footer>


</div>

</body>
</html>
